<div id="command-palette" class="hidden fixed inset-0 z-50 flex items-start justify-center bg-slate-900/50 p-4 pt-[12vh]">
  <div role="dialog" aria-modal="true" aria-labelledby="command-palette-title" class="w-full max-w-xl overflow-hidden rounded-lg border border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-900">
    <h2 id="command-palette-title" class="sr-only">{{ i18n.text("web-palette-title") }}</h2>
    <div class="flex items-center gap-3 border-b border-slate-200 px-4 dark:border-slate-700">
      <span aria-hidden="true" class="text-lg text-teal-700 dark:text-teal-300">⌕</span>
      <input id="command-palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="command-palette-list" aria-autocomplete="list" aria-label="{{ i18n.text("web-palette-input-label") }}" placeholder="{{ i18n.text("web-palette-placeholder") }}" autocomplete="off" spellcheck="false" class="w-full border-0 bg-transparent py-3 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-500">
      <kbd class="rounded border border-slate-200 px-1.5 py-0.5 font-mono text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">Esc</kbd>
    </div>
    <ul id="command-palette-list" role="listbox" aria-label="{{ i18n.text("web-palette-results") }}" class="max-h-80 overflow-y-auto p-2"></ul>
    <p id="command-palette-note" class="hidden px-4 pb-2 text-xs text-slate-500 dark:text-slate-400"></p>
    <p class="border-t border-slate-200 px-4 py-2 text-xs text-slate-500 dark:border-slate-700 dark:text-slate-400">{{ i18n.text("web-palette-hint") }}</p>
    <span id="command-palette-status" class="sr-only" role="status" aria-live="polite"></span>
  </div>
</div>
<script>
(function(){
  var overlay=document.getElementById("command-palette");
  if(!overlay)return;
  var input=document.getElementById("command-palette-input"),list=document.getElementById("command-palette-list"),note=document.getElementById("command-palette-note"),status=document.getElementById("command-palette-status");
  var T={
    project:{{ i18n.js("web-palette-kind-project")|safe }},
    page:{{ i18n.js("web-palette-kind-page")|safe }},
    empty:{{ i18n.js("web-palette-empty")|safe }},
    loading:{{ i18n.js("web-palette-loading")|safe }},
    localOnly:{{ i18n.js("web-palette-local-only")|safe }},
    searchFor:{{ i18n.js_one("web-palette-search-for", "{query}")|safe }},
    count:{{ i18n.js_one("web-palette-result-count", "{count}")|safe }}
  };
  var NAV=[
    {label:{{ i18n.js("web-projects")|safe }},href:"."},
    {label:{{ i18n.js("web-inbox")|safe }},href:"inbox"},
    {label:{{ i18n.js("web-search-memory")|safe }},href:"search"},
    {label:{{ i18n.js("web-knowledge-graph")|safe }},href:"graph"},
    {label:{{ i18n.js("web-documentation")|safe }},href:"docs"},
    {label:{{ i18n.js("web-changelog")|safe }},href:"docs/changelog"}
  ];
  var projects=null,loading=false,items=[],selected=0,opener=null;
  var isMac=/Mac|iPhone|iPad|iPod/.test((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||"");
  function projectHref(ws,proj){return "w/"+encodeURIComponent(ws)+"/"+encodeURIComponent(proj);}
  function setNote(text){note.textContent=text||"";note.classList.toggle("hidden",!text);}
  // The API answers the same session cookie as these pages; if it refuses
  // (or the API is unreachable) fall back to the projects this page knows.
  function pageProjects(){
    var seen={},out=[];
    document.querySelectorAll("[data-pin-key]").forEach(function(el){var key=el.dataset.pinKey;if(key&&!seen[key]){seen[key]=1;out.push(key);}});
    (window.aiMemoryPinnedProjects?window.aiMemoryPinnedProjects():[]).forEach(function(key){if(!seen[key]){seen[key]=1;out.push(key);}});
    return out.map(function(key){var i=key.indexOf("/");return {ws:key.slice(0,i),proj:key.slice(i+1)};});
  }
  function loadProjects(){
    if(projects||loading)return;
    loading=true;setNote(T.loading);
    var base=(document.querySelector('meta[name="ai-memory-base-path"]')||{}).content||"";
    fetch(base+"/api/v1/projects",{credentials:"same-origin",headers:{"Accept":"application/json"}})
      .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();})
      .then(function(rows){
        if(!Array.isArray(rows))throw new Error("shape");
        projects=rows.filter(function(r){return r&&typeof r.workspace_name==="string"&&typeof r.project_name==="string";}).map(function(r){return {ws:r.workspace_name,proj:r.project_name};});
        setNote("");
      })
      .catch(function(){projects=pageProjects();setNote(T.localOnly);})
      .finally(function(){loading=false;if(isOpen())render();});
  }
  function isOpen(){return !overlay.classList.contains("hidden");}
  function build(query){
    var q=query.trim().toLocaleLowerCase(),out=[];
    function score(text){var t=text.toLocaleLowerCase();if(!q)return 1;if(t.indexOf(q)===0)return 3;var at=t.indexOf(q);if(at<0)return 0;return t.charAt(at-1)==="/"||t.charAt(at-1)===" "||t.charAt(at-1)==="-"?2:1;}
    var proj=(projects||[]).map(function(p){var label=p.ws+"/"+p.proj;return {kind:T.project,label:p.proj,detail:p.ws,href:projectHref(p.ws,p.proj),score:Math.max(score(p.proj),score(label))};}).filter(function(i){return i.score>0;});
    var nav=NAV.map(function(n){return {kind:T.page,label:n.label,detail:"",href:n.href,score:score(n.label)};}).filter(function(i){return i.score>0;});
    proj.sort(function(a,b){return b.score-a.score||a.label.localeCompare(b.label);});
    nav.sort(function(a,b){return b.score-a.score;});
    out=q?proj.slice(0,50).concat(nav):nav.concat(proj.slice(0,50));
    if(q)out.push({kind:T.page,label:T.searchFor.replace("{query}",query.trim()),detail:"",href:"search?q="+encodeURIComponent(query.trim())});
    return out;
  }
  function select(index){
    var options=list.querySelectorAll('[role="option"]');
    if(!options.length){input.removeAttribute("aria-activedescendant");return;}
    selected=(index+options.length)%options.length;
    options.forEach(function(el,i){
      var on=i===selected;
      el.setAttribute("aria-selected",String(on));
      el.classList.toggle("bg-teal-50",on);el.classList.toggle("text-teal-900",on);el.classList.toggle("dark:bg-teal-900/40",on);el.classList.toggle("dark:text-teal-100",on);
    });
    input.setAttribute("aria-activedescendant",options[selected].id);
    options[selected].scrollIntoView({block:"nearest"});
  }
  function render(){
    items=build(input.value);
    list.textContent="";
    if(!items.length){
      var empty=document.createElement("li");
      empty.setAttribute("role","presentation");
      empty.className="px-3 py-6 text-center text-sm text-slate-500 dark:text-slate-400";
      empty.textContent=T.empty;
      list.appendChild(empty);
    }
    items.forEach(function(item,i){
      var li=document.createElement("li");
      li.id="command-palette-option-"+i;
      li.setAttribute("role","option");
      li.setAttribute("aria-selected","false");
      li.className="flex cursor-pointer items-center gap-3 rounded-md px-3 py-2 text-sm text-slate-800 dark:text-slate-200";
      var label=document.createElement("span");label.className="min-w-0 flex-1 truncate";label.textContent=item.label;
      if(item.detail){var detail=document.createElement("span");detail.className="ml-2 text-xs text-slate-500 dark:text-slate-400";detail.textContent=item.detail;label.appendChild(detail);}
      var kind=document.createElement("span");kind.className="shrink-0 text-xs text-teal-700 dark:text-teal-300";kind.textContent=item.kind;
      li.appendChild(label);li.appendChild(kind);
      li.addEventListener("mousemove",function(){if(selected!==i)select(i);});
      li.addEventListener("mousedown",function(e){e.preventDefault();});
      li.addEventListener("click",function(){go(i);});
      list.appendChild(li);
    });
    select(0);
    status.textContent=T.count.replace("{count}",String(items.length));
  }
  function go(index){var item=items[index];if(!item)return;close(false);location.assign(new URL(item.href,document.baseURI).href);}
  function open(){
    if(isOpen()){input.focus();input.select();return;}
    opener=document.activeElement;
    overlay.classList.remove("hidden");
    input.value="";
    loadProjects();
    render();
    input.focus();
  }
  function close(restore){
    overlay.classList.add("hidden");
    status.textContent="";
    if(restore!==false&&opener&&opener.isConnected&&typeof opener.focus==="function")opener.focus();
    opener=null;
  }
  window.aiMemoryOpenCommandPalette=open;
  input.addEventListener("input",render);
  overlay.addEventListener("mousedown",function(e){if(e.target===overlay)close();});
  overlay.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();select(selected+1);}
    else if(e.key==="ArrowUp"){e.preventDefault();select(selected-1);}
    else if(e.key==="Home"&&e.ctrlKey){e.preventDefault();select(0);}
    else if(e.key==="End"&&e.ctrlKey){e.preventDefault();select(items.length-1);}
    else if(e.key==="Enter"){e.preventDefault();go(selected);}
    else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close();}
    // The input is the only focus stop; options are reached through
    // aria-activedescendant, so Tab must not leave the modal.
    else if(e.key==="Tab"){e.preventDefault();input.focus();}
  });
  document.addEventListener("keydown",function(e){
    if((e.key==="k"||e.key==="K")&&(isMac?e.metaKey&&!e.ctrlKey:e.ctrlKey&&!e.metaKey)&&!e.altKey&&!e.shiftKey){
      e.preventDefault();
      if(isOpen())close();else open();
    }
  });
  document.addEventListener("focusin",function(e){if(isOpen()&&!overlay.contains(e.target))input.focus();});
  document.addEventListener("click",function(e){
    var trigger=e.target.closest&&e.target.closest("[data-command-palette-open]");
    if(trigger){e.preventDefault();open();}
  });
})();
</script>
